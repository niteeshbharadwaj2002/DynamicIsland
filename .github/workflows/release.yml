name: Release

# Runs when a version tag (v*) is pushed, or by hand from the Actions tab.
# Signing is optional: with the secrets below the APK is signed, without them an unsigned APK is built and
# the release says so.
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks keystore   (to be created by the repository owner)
#   ANDROID_KEYSTORE_PASSWORD  keystore and key password     (to be created by the repository owner)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # 1. Work out which version this run releases.
  check-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      version_tag: ${{ steps.check.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read versionName and check the tag
        id: check
        run: |
          NEW_VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$NEW_VERSION" ]; then
            echo "Could not find versionName in app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${NEW_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${NEW_VERSION} (expected v${NEW_VERSION})" >&2
            exit 1
          fi
          echo "Releasing v${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

  # 2. Build the release APK (signed when the keystore secrets exist).
  build-release:
    name: Build release APK
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_name: ${{ steps.version.outputs.apk_name }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      signed: ${{ steps.signing.outputs.signed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set: building an UNSIGNED release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/notchiq.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n[:space:]' | base64 --decode > "$KEYSTORE_PATH"

          KEY_ALIAS=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -n 1)
          test -n "$KEY_ALIAS" || { echo "Unable to detect a key alias" >&2; exit 1; }

          echo "SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve names
        id: version
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          SUFFIX=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then SUFFIX="-unsigned"; fi
          echo "version_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=NotchIQ-v$VERSION$SUFFIX.apk" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=NotchIQ-v$VERSION$SUFFIX.apk" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage (and verify) the APK
        run: |
          DIR="app/build/outputs/apk/release"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SOURCE_APK="$DIR/app-release.apk"
          else
            SOURCE_APK="$DIR/app-release-unsigned.apk"
          fi
          test -f "$SOURCE_APK" || { echo "Release APK was not produced ($SOURCE_APK)" >&2; ls -la "$DIR" >&2; exit 1; }
          cp "$SOURCE_APK" "$DIR/$APK_NAME"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -n 1)/apksigner"
            "$APKSIGNER" verify --verbose --print-certs "$DIR/$APK_NAME"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NotchIQ-release
          path: app/build/outputs/apk/release/NotchIQ-v*.apk
          if-no-files-found: error
          retention-days: 30

  # 3. GitHub Release.
  publish:
    name: Publish GitHub Release
    needs: [check-version, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: NotchIQ-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.build-release.outputs.apk_name }}
          VERSION_TAG: ${{ needs.build-release.outputs.version_tag }}
          SIGNED: ${{ needs.build-release.outputs.signed }}
        run: |
          NOTE=""
          if [ "$SIGNED" != "true" ]; then
            NOTE="> This APK is **unsigned** (no signing keystore is configured for this repository). Android will not install an unsigned APK until it is signed; see docs/RELEASE_SIGNING.md."
          fi

          cat > release_notes.md <<NOTES
          **NotchIQ $VERSION_TAG**: a personal, offline Dynamic Island for Android, built on Smart Island.

          $NOTE

          ## Download and install

          Download the APK: **[$APK_NAME](https://github.com/$GH_REPO/releases/download/$VERSION_TAG/$APK_NAME)**

          NotchIQ supports **Android 8.0 and newer**. Android may ask you to allow installation from your browser or file manager.

          ## Project links

          [Changelog](https://github.com/$GH_REPO/blob/main/CHANGELOG.md) · [README](https://github.com/$GH_REPO#readme) · [Privacy](https://github.com/$GH_REPO/blob/main/PRIVACY.md)
          NOTES

          # Commit-based notes after the hand-written part; categories come from .github/release.yml.
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" "$APK_NAME" --clobber
          else
            gh release create "$VERSION_TAG" "$APK_NAME" \
              --title "NotchIQ $VERSION_TAG" \
              --notes-file release_notes.md \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
